name: Feature request
description: Suggest a capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: Sketch the behaviour. A sample command, config value, or screen is ideal.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Docxy
      options:
        - CLI
        - Agent pipeline or validation
        - Docs platform or integration support
        - GitHub App or pull requests
        - Backend server or API
        - Dashboard (web)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including what you do instead today.

  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it
      options:
        - label: I am willing to open a pull request for this.
