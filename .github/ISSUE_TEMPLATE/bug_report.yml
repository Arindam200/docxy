name: Bug report
description: Something in Docxy behaves differently from what you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, tokens, or private
        repository contents. For a security problem, follow SECURITY.md instead
        of opening an issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
      placeholder: The run finished but every validation check was reported as skipped.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order.
      value: |
        1. 
        2. 
        3. 
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output or error
      description: Paste the relevant log lines. Redact anything private first.
      render: text

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen
      options:
        - CLI
        - Agent pipeline or validation
        - GitHub App or pull requests
        - Backend server or API
        - Dashboard (web)
        - Setup, environment, or docs
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the release you are on.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
      placeholder: macOS 15.3, Node 22.22.3
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `npm run docxy -- doctor`
      description: Optional, but it answers most setup questions at once.
      render: text
