name: cla

# Asks a first time contributor to sign CLA.md, then records the signature so
# they are never asked again. It records that the contributor had the right to
# submit the code and licenses it to the project, which keeps the provenance of
# the AGPL licensed codebase clean.
#
# One time setup: this needs a branch named `cla-signatures` to store the file.
# Create it empty, from main, before the first pull request arrives:
#
#   git switch --orphan cla-signatures && git commit --allow-empty -m "CLA signatures" && git push -u origin cla-signatures
#
# Signatures are public, which is the point; anyone can verify who agreed to what.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Deliberately no checkout of the pull request branch. This job reads comments
# and writes the signature file, and never runs contributor code.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  signature:
    name: Check the CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/Arindam200/docxy/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer and bots do not sign.
          allowlist: Arindam200,bot*,dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Contributions to Docxy need a one time
            Contributor License Agreement before they can be merged. Please read [CLA.md](https://github.com/Arindam200/docxy/blob/main/CLA.md)
            and, if you agree, reply to this pull request with exactly the
            sentence below. You keep the copyright in your work, and you will not
            be asked again.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: CLA signed, thank you. Review is next.
          lock-pullrequest-aftermerge: false
